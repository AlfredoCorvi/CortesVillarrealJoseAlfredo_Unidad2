{% if form.errors %}
    <div class="form-errors" role="alert">
        <p>Revisa los datos para continuar.</p>
        {{ form.non_field_errors }}
    </div>
{% endif %}
{% for field in form %}
    <div class="form-field">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
        {{ field.errors }}
    </div>
{% endfor %}
