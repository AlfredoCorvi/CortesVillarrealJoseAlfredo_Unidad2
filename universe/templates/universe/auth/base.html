{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090e17">
    <title>{% block title %}Tu cuenta{% endblock %} | Cosmoz</title>
    <link rel="stylesheet" href="{% static 'universe/css/index.css' %}">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header container">
        <a class="brand" href="{% url 'home' %}" aria-label="Cosmoz, inicio"><span class="brand-symbol" aria-hidden="true">✳</span> cosmoz<span class="brand-dot">.</span></a>
        <a class="text-link" href="{% url 'home' %}">← Volver a explorar</a>
    </header>
    <main class="auth-layout container" id="contenido">
        <section class="auth-intro">
            <p class="eyebrow">TU LUGAR EN EL UNIVERSO</p>
            <h1>La próxima aventura<br>empieza <em>contigo.</em></h1>
            <p>Forma parte de Cosmoz y sigue descubriendo los mundos que nos rodean.</p>
            <div class="auth-orbit" aria-hidden="true"><div class="planet-sphere saturno"></div></div>
        </section>
        <section class="auth-card" aria-labelledby="auth-title">
            {% block form_content %}{% endblock %}
        </section>
    </main>
</body>
</html>
