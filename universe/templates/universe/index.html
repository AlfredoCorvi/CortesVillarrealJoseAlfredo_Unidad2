<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body>
    <main>
        <h1>{{ title }}</h1>
        <p>¡Bienvenido a mi primera página con Django! Excelente trabajo.</p>
        <br>
        <h2>Lista de planetas</h2>
        <p>Hay {{ planets|length }} planetas en este sistema solar.</p>
        <ul>
            {% for planet in planets %}
                <li> {{planet}} </li>
            {% endfor %}
        </ul>    
    </main>
</body>
</html>
